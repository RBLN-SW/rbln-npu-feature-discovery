name: Go Unit Tests

on:
  workflow_call:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read Go version
        id: versions
        run: |
          GOLANG_VERSION=$(grep '^GOLANG_VERSION' versions.mk | cut -d'=' -f2 | tr -d ' ?')
          echo "golang-version=${GOLANG_VERSION}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ steps.versions.outputs.golang-version }}
          cache: true
      - name: Run unit and filesystem tests
        run: make test GO_TEST_FLAGS=-race
