# ob pipeline upload command: buildkite-agent pipeline upload .buildkite/pipeline.rnpm.pr.yml
# The RNPM pr bundle manages image builds and scenario steps.
env:
  RNPM_URL: https://rnpm.k8s.rebellions.in

agents:
  queue: k8s

steps:
  - label: ":package: pr › upload"
    key: rnpm-bundle-pr
    secrets:
      RNPM_TOKEN: RNPM_TOKEN
    command: |
      set -euo pipefail
      curl -fsSL -H "Authorization: Bearer $$RNPM_TOKEN" \
        "${RNPM_URL}/api/v1/bundles/RBLN-SW/rbln-npu-feature-discovery/pr?run=$${RNPM_RUN:-}" | buildkite-agent pipeline upload
