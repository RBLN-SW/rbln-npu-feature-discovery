# ob pipeline upload command: buildkite-agent pipeline upload .buildkite/pipeline.piper.pr.yml
# The piper pr bundle manages image builds and scenario steps.
env:
  PIPER_URL: https://piper.k8s.rebellions.in

agents:
  queue: k8s

steps:
  - label: ":package: pr › upload"
    key: piper-bundle-pr
    secrets:
      PIPER_TOKEN: PIPER_TOKEN
    command: |
      set -euo pipefail
      curl -fsSL -H "Authorization: Bearer $$PIPER_TOKEN" \
        "${PIPER_URL}/api/v1/bundles/RBLN-SW/rbln-npu-feature-discovery/pr?run=$${PIPER_RUN:-}" | buildkite-agent pipeline upload
